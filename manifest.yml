modules:
  rovo:agent:
    - key: cold-reader
      name: Cold Reader
      description: Reads one Confluence page with no other context and answers the questions a newcomer would ask.
      prompt: >
        You are Cold Reader. You check what a newcomer would understand from one
        Confluence page.

        When the user asks for a cold read, call the get-cold-read-packet action
        with the page ID. The packet contains a runId, the full text of that one
        page and a numbered list of questions.

        Answer every question using ONLY the page text from the packet. Do not use
        search, other pages, earlier messages or general knowledge. If the page
        does not state the answer, the answer starts with "NOT STATED"; after it
        you may add one short sentence on what is missing or ambiguous. Keep each
        answer to one or two sentences and add the shortest quote from the page
        that supports it (empty quote for NOT STATED).

        Then call the submit-cold-read-answers action once, with the page ID, the
        runId from the packet and the answers as a JSON array of objects
        {"q": number, "answer": string, "quote": string}.

        Only after your answers are saved, its result may contain the page
        owner's expected answers. Do not change your answers. Compare each saved
        answer with the expected answer and give one verdict:
        "match" - your answer means the same as the expected answer;
        "A" - a newcomer who follows the page would act differently from what the
        owner expects, stop, or repeat something that is already done;
        "B" - the page says something wrong or out of date, but the next action
        would not change;
        "C" - the page does not cover what the owner expects.
        Add a one-sentence note on what the page should add or fix (empty for
        match). Then call the submit-cold-read-findings action once, with the page
        ID, the runId and the findings as a JSON array of objects
        {"q": number, "verdict": string, "note": string}.

        Finally show the user the findings, A first, each with its note, and tell
        them that Cold Read under the page title shows the answers next to the
        expected ones. If there were no expected answers, show your answers as a
        numbered list and name the NOT STATED ones as gaps in the page.
      conversationStarters:
        - Run a cold read of this page
      actions:
        - get-cold-read-packet
        - submit-cold-read-answers
        - submit-cold-read-findings
  action:
    - key: get-cold-read-packet
      name: Get cold read packet
      function: getPacket
      actionVerb: GET
      description: >
        Returns the text of one Confluence page and the questions a newcomer
        would ask about it. Call this first, before answering anything.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: true
          description: The numeric ID of the Confluence page to read.
    - key: submit-cold-read-answers
      name: Submit cold read answers
      function: submitAnswers
      actionVerb: CREATE
      description: >
        Records the answers to the cold read questions for one page. Call it
        once, after answering all questions from the packet.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: true
          description: The numeric ID of the Confluence page that was read.
        runId:
          title: Run ID
          type: string
          required: true
          description: The runId from the cold read packet.
        answers:
          title: Answers
          type: string
          required: true
          description: >
            JSON array of objects {"q": number, "answer": string, "quote": string},
            one per question, in the order of the questions.
    - key: submit-cold-read-findings
      name: Submit cold read findings
      function: submitFindings
      actionVerb: CREATE
      description: >
        Records how the saved cold read answers compare with the page owner's
        expected answers. Call it once, after submit-cold-read-answers returned
        the expected answers.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: true
          description: The numeric ID of the Confluence page that was read.
        runId:
          title: Run ID
          type: string
          required: true
          description: The runId from the cold read packet.
        findings:
          title: Findings
          type: string
          required: true
          description: >
            JSON array of objects {"q": number, "verdict": "match" | "A" | "B" | "C",
            "note": string}, one per question that has an expected answer.
  confluence:contentBylineItem:
    - key: cold-read-byline
      title: Cold Read
      tooltip: What would a newcomer understand from this page?
      resource: panel
      render: native
      resolver:
        function: panelResolver
      viewportContainer: modal
      viewportSize: large
  function:
    - key: getPacket
      handler: index.getPacket
    - key: submitAnswers
      handler: index.submitAnswers
    - key: submitFindings
      handler: index.submitFindings
    - key: panelResolver
      handler: resolvers.handler
resources:
  - key: panel
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:page:confluence
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/e881a251-e585-4efe-8680-72dc90fcb38f

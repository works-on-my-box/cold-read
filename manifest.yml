modules:
  rovo:agent:
    - key: cold-reader
      name: Cold Reader
      description: Reads one Confluence page with no other context and answers the questions a newcomer would ask.
      prompt: >
        You are Cold Reader. You check what a newcomer would understand from one
        Confluence page.

        Step 1. When the user asks for a cold read, call get-cold-read-packet with
        the page ID. The packet contains a runId, the full text of that one page
        and numbered questions.

        Step 2. Answer every question using ONLY the page text from the packet. Do
        not use search, other pages, earlier messages or general knowledge. If the
        page does not state the answer, the answer starts with "NOT STATED"; after
        it you may add one short sentence on what is missing or ambiguous. Keep
        each answer to one or two sentences and add the shortest quote from the
        page that supports it (empty quote for NOT STATED). Call
        submit-cold-read-answers once, with the page ID, the runId and the answers
        as a JSON array of objects {"q": number, "answer": string, "quote": string}.

        Step 3. Only after your answers are saved you get something to compare
        them with. Do not change your saved answers.
        If the result of submit-cold-read-answers contains "expected", these are
        the page owner's expected answers: compare each saved answer with its
        expected answer.
        Otherwise call get-warm-read-packet with the page ID and the runId. It
        returns related pages found by search. Answer each question again from the
        page and the related pages together, and compare that warm answer with
        your saved cold answer.
        Give one verdict per compared question:
        "match" - the two answers mean the same;
        "A" - a newcomer who follows the page would act differently than they
        should, stop, or repeat something that is already done;
        "B" - the page says something wrong or out of date, but the next action
        would not change;
        "C" - the page leaves out something the owner expects or the related pages
        answer.
        Add a one-sentence note on what the page should add or fix, naming the
        related page when it is the source (empty note for match). Call
        submit-cold-read-findings once, with the page ID, the runId and the
        findings as a JSON array of objects {"q": number, "verdict": string,
        "note": string}.

        Step 4. Show the user the findings, A first, each with its note, and tell
        them that Cold Read under the page title shows the full comparison.
      conversationStarters:
        - Run a cold read of this page
      actions:
        - get-cold-read-packet
        - submit-cold-read-answers
        - get-warm-read-packet
        - submit-cold-read-findings
        - get-cold-read-status
  rovo:mcp:
    - key: cold-read-mcp
      name: Cold Read
      tools:
        - get-cold-read-status
        - get-cold-read-packet
        - submit-cold-read-answers
        - get-warm-read-packet
        - submit-cold-read-findings
  action:
    - key: get-cold-read-status
      name: Get cold read status
      function: getStatus
      actionVerb: GET
      description: >
        Returns the latest cold read of a Confluence page: its findings, whether it
        is up to date and one line of advice. Call it before acting on a runbook,
        handoff or how-to page.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: true
          description: The numeric ID of the Confluence page.
    - key: get-cold-read-packet
      name: Get cold read packet
      function: getPacket
      actionVerb: GET
      description: >
        Returns the text of one Confluence page and the questions a newcomer
        would ask about it. Call this first, before answering anything.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: true
          description: The numeric ID of the Confluence page to read.
    - key: submit-cold-read-answers
      name: Submit cold read answers
      function: submitAnswers
      actionVerb: CREATE
      description: >
        Records the answers to the cold read questions for one page. Call it
        once, after answering all questions from the packet.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: true
          description: The numeric ID of the Confluence page that was read.
        runId:
          title: Run ID
          type: string
          required: true
          description: The runId from the cold read packet.
        answers:
          title: Answers
          type: string
          required: true
          description: >
            JSON array of objects {"q": number, "answer": string, "quote": string},
            one per question, in the order of the questions.
    - key: get-warm-read-packet
      name: Get warm read packet
      function: getWarmPacket
      actionVerb: GET
      description: >
        Returns pages related to the cold-read page, found by search, so the same
        questions can be answered again with more context. Call it only after
        submit-cold-read-answers, when its result has no expected answers.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: true
          description: The numeric ID of the Confluence page that was read.
        runId:
          title: Run ID
          type: string
          required: true
          description: The runId from the cold read packet.
    - key: submit-cold-read-findings
      name: Submit cold read findings
      function: submitFindings
      actionVerb: CREATE
      description: >
        Records how the saved cold read answers compare with the page owner's
        expected answers or with the warm read. Call it once, at the end.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: true
          description: The numeric ID of the Confluence page that was read.
        runId:
          title: Run ID
          type: string
          required: true
          description: The runId from the cold read packet.
        findings:
          title: Findings
          type: string
          required: true
          description: >
            JSON array of objects {"q": number, "verdict": "match" | "A" | "B" | "C",
            "note": string}, one per compared question.
  confluence:contentBylineItem:
    - key: cold-read-byline
      title: Cold Read
      tooltip: What would a newcomer understand from this page?
      resource: panel
      render: native
      resolver:
        function: panelResolver
      viewportContainer: modal
      viewportSize: large
  function:
    - key: getPacket
      handler: index.getPacket
    - key: submitAnswers
      handler: index.submitAnswers
    - key: getWarmPacket
      handler: index.getWarmPacket
    - key: getStatus
      handler: index.getStatus
    - key: submitFindings
      handler: index.submitFindings
    - key: panelResolver
      handler: resolvers.handler
resources:
  - key: panel
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:page:confluence
    - search:confluence
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/e881a251-e585-4efe-8680-72dc90fcb38f
